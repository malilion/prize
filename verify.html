<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>憑證包驗證 · 抽獎轉盤</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="verify.css">
</head>
<body>
  <main>
    <header><a href="index.html">← 返回抽獎轉盤</a><h1>憑證包驗證</h1><p>選擇抽獎轉盤匯出的 ZIP。檔案只在本機讀取，不會上傳。</p></header>
    <section class="card">
      <label for="archive">憑證 ZIP</label>
      <input id="archive" type="file" accept=".zip,application/zip">
      <label for="expected-hash">活動時公開的 ZIP SHA-256（選填）</label>
      <input id="expected-hash" type="text" inputmode="latin" autocomplete="off" spellcheck="false" maxlength="64" placeholder="64 位十六進位字元">
      <p id="status" role="status" aria-live="polite">尚未選擇檔案</p>
    </section>
    <section class="card" id="result" hidden>
      <h2 id="result-title"></h2>
      <p id="summary"></p>
      <p>這份 ZIP 的 SHA-256：<code id="actual-hash"></code></p>
      <p id="hash-match" role="status"></p>
      <h3>檢查結果</h3><ul id="issues"></ul>
      <h3>抽獎紀錄</h3><ol id="draws"></ol>
    </section>
    <p class="note">驗證結果表示 ZIP 內的候選名單、結果、錄影與雜湊值彼此一致。它無法單獨證明抽獎當時的程式、亂數或檔案從未被整包重建；公開且留存抽獎當下的雜湊值有助於比對。</p>
  </main>
  <script src="js/util.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/evidence.js"></script>
  <script src="js/eligibility.js"></script>
  <script src="js/verify.js"></script>
</body>
</html>
